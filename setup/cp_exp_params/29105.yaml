# NCC on covid, seq2seq base forecaster, 3-step ahead (base predictions: saved_pred_19.pickle)

data_file_id: 19
week_ahead_list: [3]
training_params:
  epochs: 2
  val_weeks: 1
  test_weeks: 122
  cov_window_size: 15
  init_err_seq_w_alpha: true
  qloss_factor: 0.1
  eloss_factor: 0.001
  K: 2.26
  three_stage_training: true
  epochs_in_stage: [50, 50, 1]
  loss_factors: [[0.1, 0, 0], [0, 1, 0], [0.1, 1, 0]]
  retrain_period: 2
  retrain_epoch: 5
  retrain_epochs: [10, 10, 2]
  total_steps_limit: 70
model_params:
  hidden_dim: 512
  qhat_encoder_hidden_dim: 128
  qhat_encoder_num_layers: 8
  error_encoder_hidden_dim: 64
  alpha_encoder_hidden_dim: 128
  q_fc_hidden_dim: 64
