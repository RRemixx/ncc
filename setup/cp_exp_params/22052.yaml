# NCC on electricity, transformer base forecaster, 1-step ahead (base predictions: saved_pred_50.pickle)

data_file_id: 50
training_params:
  epochs: 200
  val_weeks: 100
  test_weeks: 150
  cov_window_size: 20
  qloss_factor: 0.2
  eloss_factor: 0.0001
  K: 3
  three_stage_training: true
  loss_factors: [[1, 0, 0], [0, 1, 0.05], [0.01, 1, 0.1]]
  retrain_period: 2
  retrain_epoch: 20
  retrain_epochs: [5, 5, 7]
  use_tta: true
model_params:
  hidden_dim: 128
  score_encoder_hidden_dim: 32
  score_encoder_num_layers: 8
  qhat_encoder_hidden_dim: 128
  qhat_encoder_num_layers: 8
  error_encoder_hidden_dim: 64
  alpha_encoder_hidden_dim: 64
