# NCC on weather, seq2seq base forecaster, 1-step ahead (base predictions: saved_pred_30.pickle)

data_file_id: 30
training_params:
  epochs: 200
  val_weeks: 144
  test_weeks: 144
  cov_window_size: 25
  qloss_factor: 0.21
  eloss_factor: 4.5e-05
  K: 0.37
  epochs_in_stage: [50, 50, 10]
  retrain_epoch: 20
  retrain_epochs: [5, 5, 10]
  use_tta: true
model_params:
  hidden_dim: 32
  score_encoder_hidden_dim: 32
  score_encoder_num_layers: 8
  qhat_encoder_hidden_dim: 128
  qhat_encoder_num_layers: 8
  error_encoder_hidden_dim: 64
  alpha_encoder_hidden_dim: 64
